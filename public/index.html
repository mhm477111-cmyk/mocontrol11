<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحوم أكاديمي</title><meta name="theme-color" content="#0A0D18">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--deep:#06080F;--base:#0A0D18;--surf:#111527;--elev:#181D30;--bar:#080B15;--pri:#8B7FFF;--pri2:#6A5ED4;--sec:#FF8C6B;--acc:#6FE8C4;--tx:#F0EEFF;--tx2:#9A90C8;--mut:#4A4468;--ok:#6FE8C4;--warn:#FFCA6B;--err:#FF7B6B;--line:#1E1A3A}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:var(--base);color:var(--tx);padding-top:env(safe-area-inset-top,0px);user-select:none}
input,select,button{font-family:inherit}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.pad{padding:20px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pri2),var(--pri),#AB9FFF);display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:0 10px 30px #8B7FFF33}
.logo.sm{width:34px;height:34px;border-radius:11px;font-size:17px}
.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{transform:scale(1.12);opacity:.7}}
.card{background:linear-gradient(135deg,var(--elev),var(--surf));border:1px solid #8B7FFF26;border-radius:20px;padding:16px;box-shadow:0 8px 20px #0006}
.btn{border:0;border-radius:14px;padding:14px 18px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--pri2),var(--pri),#AB9FFF);box-shadow:0 4px 14px #8B7FFF4d;width:100%}
.btn:disabled{opacity:.6}.btn.red{background:linear-gradient(135deg,#FF6B6B,var(--sec))}.btn.ghost{background:none;box-shadow:none;border:1px solid #FF7B6B55;color:var(--err)}
.link{background:none;border:0;color:var(--tx2);font-size:14px;cursor:pointer;margin-top:14px}
.fld{width:100%;background:var(--deep);border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);font-size:15px;margin-bottom:12px;outline:none;user-select:text}
.fld:focus{border-color:var(--pri)}
.tag{display:inline-flex;gap:5px;align-items:center;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;background:#ffffff0d}
.hero{background:linear-gradient(225deg,#1A1040,#0F1228,#0A0D18);border-radius:24px;padding:24px;margin-bottom:22px;border:1px solid #8B7FFF22}
.hero h2{font-size:26px;line-height:1.5;margin:10px 0 6px}
h3{font-size:17px;margin:20px 0 12px}
.nav{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;cursor:pointer;text-align:right;width:100%;color:var(--tx);font-size:inherit}
.nav .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#8B7FFF1f;flex:none}
.nav b{display:block;font-size:16px}.nav small{color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid.two{grid-template-columns:1fr 1fr}
.tile{text-align:center;padding:22px 8px;cursor:pointer;color:var(--tx);font-size:inherit}
.tile .ic{font-size:34px;display:block;margin-bottom:8px}.tile b{font-size:16px}.tile small{display:block;color:var(--tx2)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bar);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top b{flex:1}.back{background:none;border:0;color:var(--pri);font-size:22px;cursor:pointer}
.bot{position:sticky;bottom:0;display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);margin-top:auto}
.bot button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:11px;cursor:pointer}
.bot button span{display:block;font-size:20px}.bot button.on{color:var(--pri)}
.ann b{display:block;margin-bottom:4px}.ann p{color:var(--tx2);font-size:14px;line-height:1.8;white-space:pre-wrap}
.row{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{text-align:center;padding:14px 4px}.stat b{display:block;font-size:18px}.stat small{color:var(--tx2)}
.vid{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.vid iframe{width:100%;height:100%;border:0}
#wm{position:absolute;pointer-events:none;transform:translate(-50%,-50%) rotate(-17deg);text-align:center;font-weight:700;font-size:13px;line-height:1.4;color:#ffffff22;text-shadow:1px 1px 4px #0006;white-space:pre;transition:left 4s ease-in-out,top 4s ease-in-out;z-index:2}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surf);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.pdf{position:fixed;inset:0;background:var(--base);z-index:30;display:flex;flex-direction:column}.pdf iframe{flex:1;border:0;background:#fff}
#toast{position:fixed;left:16px;right:16px;bottom:90px;margin:auto;max-width:480px;padding:14px 16px;border-radius:14px;font-weight:700;color:#06080F;z-index:50;display:none;text-align:center}
.empty{text-align:center;color:var(--tx2);padding:40px 10px}
.enter{animation:in .6s ease-out both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.pulse,.enter{animation:none}#wm{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const U='https://ztjzmmjgddddogvbgdfw.supabase.co',K='sb_publishable_AQCydKXBQ1tDUn7Ip6_IVw_Y7FqqJDN';
const sb=supabase.createClient(U,K);
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={user:null,profile:null,loading:true,isLogin:true,busy:false,tab:0,screen:'home',year:null,div:null,dept:null,subj:null,course:null,courses:[],lectures:[],my:[],uIds:[],uCourses:[],ann:[],cur:null,edit:false,pdf:null,hideCode:false};
let ch=null,wmT=null,tt;
const devId=()=>{let d=localStorage.getItem('local_device_id');if(!d){d=Array.from({length:32},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join('');localStorage.setItem('local_device_id',d)}return d};
const Y=n=>({1:'الفرقة الأولى',2:'الفرقة الثانية',3:'الفرقة الثالثة'}[n]||'غير محدد');
const byDate=(a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0);
function toast(m,c='err'){const t=$('#toast');t.textContent=m;t.style.background=`var(--${c})`;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
const logo=(c='')=>`<div class="logo ${c}">ر</div>`;

/* ───── data ───── */
async function loadProfile(){
  const r=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  const p=r.data;
  if(p&&p.device_id&&p.device_id!==devId()){await sb.auth.signOut();toast('هذا الحساب مُسجل على هاتف آخر، لا يمكنك الدخول من هذا الجهاز.');return false}
  S.profile=p;return true;
}
async function loadCourses(){
  const r=await sb.from('courses').select('*').eq('year',S.year).eq('division',S.div).eq('subject_type',S.subj);
  let c=r.data||[];if(S.div==='عام'&&S.dept)c=c.filter(x=>x.department===S.dept);
  S.courses=c.sort(byDate);
}
async function loadLectures(){
  const r=await sb.from('lectures').select('*').eq('course_id',S.course);
  S.lectures=(r.data||[]).sort(byDate);
}
async function fetchAll(){
  if(!S.user)return;
  const id=S.user.id;
  const [a,sl,sc]=await Promise.all([sb.from('announcements').select('*'),sb.from('student_lectures').select('lecture_id').eq('student_id',id),sb.from('student_courses').select('course_id').eq('student_id',id)]);
  S.ann=(a.data||[]).sort(byDate);S.uIds=(sl.data||[]).map(x=>x.lecture_id);S.uCourses=(sc.data||[]).map(x=>String(x.course_id));
  const m={};
  if(S.uIds.length){const r=await sb.from('lectures').select('*, courses(*)').in('id',S.uIds);(r.data||[]).forEach(l=>m[l.id]=l)}
  if(S.uCourses.length){const r=await sb.from('lectures').select('*, courses(*)').in('course_id',S.uCourses);(r.data||[]).forEach(l=>m[l.id]=l)}
  S.my=Object.values(m).sort(byDate);
  if(S.screen==='courses')await loadCourses();
  if(['lectures','video'].includes(S.screen)&&S.course)await loadLectures();
  if(!/INPUT|SELECT/.test(document.activeElement?.tagName||''))draw();
}
function subscribe(){
  unsub();const id=S.user.id;ch=sb.channel('rahoum-'+id);
  ['announcements','courses','lectures'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},fetchAll));
  ['student_lectures','student_courses'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t,filter:'student_id=eq.'+id},fetchAll));
  ch.on('postgres_changes',{event:'*',schema:'public',table:'profiles',filter:'id=eq.'+id},async()=>{if(await loadProfile())draw()});
  ch.subscribe();
}
function unsub(){if(ch){sb.removeChannel(ch);ch=null}}
const unlocked=l=>S.uIds.includes(l.id)||S.uCourses.includes(String(l.course_id));

sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
  if(s?.user){
    if(S.user?.id===s.user.id&&S.profile)return;
    S.user=s.user;
    if(await loadProfile()){subscribe();await fetchAll()}
  }else{S.user=null;S.profile=null;unsub();S.screen='home';S.tab=0}
  S.loading=false;draw();
},0));

/* ───── actions ───── */
async function submit(){
  const ph=$('#ph').value.trim(),pw=$('#pw').value.trim();
  if(!ph||!pw)return toast('من فضلك ادخل رقم التليفون وكلمة المرور','warn');
  if(ph.length!==11)return toast('رقم التليفون يجب أن يتكون من 11 رقماً','warn');
  const email=ph+'@rahoum.com',dev=devId();S.busy=true;$('#go').disabled=true;
  try{
    if(S.isLogin){
      const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
      const {data:p}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
      if(!p.device_id)await sb.from('profiles').update({device_id:dev}).eq('id',data.user.id);
      else if(p.device_id!==dev){await sb.auth.signOut();toast('هذا الحساب مربوط بهاتف آخر! لا يُسمح بتسجيل الدخول من جهاز جديد.')}
    }else{
      const name=$('#nm').value.trim(),yr=+$('#yr').value,dv=$('#dv').value;
      if(!name||!yr||!dv){S.busy=false;$('#go').disabled=false;return toast('من فضلك استكمل جميع البيانات المطلوبة','warn')}
      const {data,error}=await sb.auth.signUp({email,password:pw});if(error)throw error;
      if(data.user){const r=await sb.from('profiles').insert({id:data.user.id,full_name:name,phone:ph,year:yr,division:dv,is_active:false,role:'student',device_id:dev});if(r.error)throw r.error;toast('تم إنشاء حسابك بنجاح! وهو الآن في انتظار التفعيل. 💜','ok')}
    }
  }catch(x){toast('عذراً، حدث خطأ! تأكد من البيانات.')}
  S.busy=false;const g=$('#go');if(g)g.disabled=false;
}
async function unlockCourse(){
  const code=$('#code').value.trim();if(!code)return toast('اكتب كود التفعيل الأول','warn');
  try{
    const {data}=await sb.from('access_codes').select('*').eq('code',code).eq('course_id',S.course).eq('is_used',false).maybeSingle();
    if(!data)return toast('الكود غير صحيح أو تم استخدامه من قبل!');
    const u=await sb.from('access_codes').update({is_used:true,used_by:S.profile.id}).eq('code',code).eq('is_used',false).select();
    if(!u.data||!u.data.length)return toast('الكود غير صحيح أو تم استخدامه من قبل!');
    await sb.from('student_courses').insert({student_id:S.profile.id,course_id:S.course});
    toast('تم تفعيل المادة بنجاح 🚀','ok');fetchAll();
  }catch(x){toast('حدث خطأ أثناء التفعيل')}
}
async function saveProfile(){
  const name=$('#en').value.trim(),pw=$('#ep').value.trim();
  if(!name)return toast('يرجى إدخال الاسم');
  try{
    const f={full_name:name,year:+$('#ey').value,division:$('#ed').value};
    const r=await sb.from('profiles').update(f).eq('id',S.profile.id);if(r.error)throw r.error;
    if(pw){if(pw.length<6)return toast('كلمة المرور ضعيفة جداً');const u=await sb.auth.updateUser({password:pw});if(u.error)throw u.error}
    Object.assign(S.profile,f);S.edit=false;toast('تم تحديث البيانات بنجاح 💜','ok');draw();
  }catch(x){toast('حدث خطأ أثناء الحفظ')}
}
const BACK={video:'lectures',lectures:'courses',courses:'subjects',subjects:()=>S.div==='عام'?'departments':'divisions',departments:'divisions',divisions:'home'};
async function go(s){
  S.screen=s;
  if(s==='courses')await loadCourses();
  if(s==='lectures'){S.hideCode=false;await loadLectures()}
  draw();
}
function back(){const b=BACK[S.screen];go(typeof b==='function'?b():b)}
function play(l){
  const c=l.courses;
  if(c){Object.assign(S,{year:c.year,div:c.division,dept:c.department,subj:c.subject_type})}
  S.course=String(l.course_id);S.cur=l;go('video');
}

/* ───── views ───── */
function login(){
  const il=S.isLogin;
  return `<div class="center enter"><div>${logo()}</div><h1 style="margin:14px 0 4px;font-size:26px">رحوم أكاديمي</h1>
  <span class="tag" style="color:var(--pri);margin-bottom:22px">${il?'تسجيل الدخول':'إنشاء حساب جديد'}</span>
  <div style="width:100%;max-width:380px" class="card">
  ${il?'':`<input id="nm" class="fld" placeholder="الاسم بالكامل">
  <select id="yr" class="fld"><option value="">الفرقة الدراسية</option><option value="1">الفرقة الأولى</option><option value="2">الفرقة الثانية</option><option value="3">الفرقة الثالثة</option></select>
  <select id="dv" class="fld"><option value="">الشعبة</option><option>عام</option><option>أساسي</option></select>`}
  <input id="ph" class="fld" inputmode="numeric" maxlength="11" placeholder="رقم التليفون">
  <div style="position:relative"><input id="pw" class="fld" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')submit()"><button type="button" class="back" style="position:absolute;left:10px;top:9px;font-size:18px" onclick="const p=$('#pw');p.type=p.type==='password'?'text':'password'">👁</button></div>
  <button id="go" class="btn" onclick="submit()">${il?'تسجيل الدخول':'إنشاء الحساب'}</button></div>
  <button class="link" onclick="S.isLogin=!S.isLogin;draw()">${il?'ليس لديك حساب؟ إنشاء حساب جديد':'لديك حساب؟ تسجيل الدخول'}</button></div>`;
}
const pending=()=>`<div class="top">${logo('sm')}<b>رحوم أكاديمي</b><button class="back" style="color:var(--err)" onclick="sb.auth.signOut()">⎋</button></div>
<div class="center"><div style="font-size:60px">⏳</div><h2 style="margin:16px 0">الحساب في انتظار التفعيل</h2>
<div class="card" style="color:var(--tx2);line-height:1.9;font-size:14px">يسعدنا انضمامك يا بطل! 💜<br><br>بياناتك قيد المراجعة حالياً، وسيتم تفعيل حسابك من قِبل د. رحمة مرسي في أقرب وقت لتتمكن من متابعة محاضراتك والانطلاق نحو التفوق.</div></div>`;
const annCard=a=>`<div class="card ann" style="margin-bottom:12px"><b>📢 ${e(a.title||'إعلان')}</b><p>${e(a.body)}</p></div>`;
const navCard=(t,s,i,fn)=>`<button class="card nav" onclick="${fn}"><span class="ic">${i}</span><span><b>${t}</b><small>${s}</small></span></button>`;
const head=t=>`<h2 style="margin-bottom:18px">${t}</h2>`;

function home(){
  const p=S.profile;
  return `<div class="hero"><span class="tag" style="color:var(--pri)">أهلاً يا ${e((p.full_name||'الطالب').split(' ')[0])} 👋</span>
  <h2>مستعد تكمل<br>رحلة التفوق؟ 🚀</h2><p style="color:var(--tx2);font-size:14px">مع د. رحمة مرسي، كل خطوة بتقربك من هدفك 💜</p>
  <div class="row" style="margin-top:14px"><span class="tag" style="color:var(--acc)">${Y(p.year)}</span><span class="tag" style="color:var(--warn)">${e(p.division||'عام')}</span></div></div>
  <h3 style="margin-top:0">اختر فرقتك</h3>
  <div class="grid">${[[1,'الأولى','1️⃣'],[2,'الثانية','2️⃣'],[3,'الثالثة','3️⃣']].map(([n,t,i])=>`<button class="card tile" onclick="S.year=${n};go('divisions')"><span class="ic">${i}</span><b>${t}</b></button>`).join('')}</div>
  <h3>آخر الإعلانات</h3>${S.ann.length?S.ann.map(annCard).join(''):'<div class="empty">لا توجد إعلانات حالياً</div>'}`;
}
function myLectures(){
  return head('محاضراتي')+(S.my.length?S.my.map((l,i)=>{
    const c=l.courses||{};
    const sub=c.name_ar?`${e(c.name_ar)} • ${Y(c.year)} • شعبة ${e(c.division||'عام')}${c.department?' • قسم '+e(c.department):''}`:'اضغط للتشغيل';
    return `<button class="card nav" onclick="play(S.my[${i}])"><span class="ic">▶️</span><span><b>${e(l.title||'محاضرة')}</b><small>${sub}</small></span></button>`}).join(''):
    '<div class="empty"><div style="font-size:48px">📚</div><b>لم تقم بتفعيل أي محاضرات بعد</b><br>ابدأ بتفعيل أول محاضرة لك! 🚀</div>');
}
const notifs=()=>head('الإشعارات')+(S.ann.length?S.ann.map(a=>annCard({...a,title:a.title||'تنبيه'})).join(''):'<div class="empty">لا توجد إشعارات</div>');
function profile(){
  const p=S.profile;
  return `<div style="text-align:center">${logo()}<h2 style="margin-top:12px">${e(p.full_name||'طالب')}</h2><p style="color:var(--tx2)">${e(p.phone)}</p></div>
  <div class="stats"><div class="card stat"><b>${S.my.length}</b><small>محاضراتي</small></div><div class="card stat"><b>${Y(p.year).replace('الفرقة ','')}</b><small>الفرقة</small></div><div class="card stat"><b>${e(p.division||'غير محدد')}</b><small>الشعبة</small></div></div>
  ${navCard('تعديل الحساب','تغيير الاسم أو كلمة المرور','✏️',"S.edit=true;draw()")}
  ${navCard('تواصل معنا','عبر واتساب مع د. رحمة مرسي','💬',"window.open('https://wa.me/201000000000','_blank')")}
  <button class="btn ghost" onclick="sb.auth.signOut()">تسجيل الخروج</button>`;
}
const flow={
  divisions:()=>head('اختر الشعبة')+navCard('شعبة عامة','مناهج الفرق المختلفة','👥',"S.div='عام';go('departments')")+navCard('شعبة أساسي','التخصص الأساسي','🎓',"S.div='أساسي';S.dept=null;go('subjects')"),
  departments:()=>head('اختر القسم')+navCard('كيمياء','Chemistry','🧪',"S.dept='كيمياء';go('subjects')")+navCard('فيزياء','Physics','⚡',"S.dept='فيزياء';go('subjects')")+navCard('بايولوجي','Biology','🧬',"S.dept='بايو';go('subjects')"),
  subjects:()=>head('اختر التخصص')+`<div class="grid two">
    <button class="card tile" onclick="S.subj='بايو';go('courses')"><span class="ic">🧬</span><b>بايولوجي</b><small>Biology</small></button>
    <button class="card tile" onclick="S.subj='جيو';go('courses')"><span class="ic">🌍</span><b>جيولوجيا</b><small>Geology</small></button></div>`,
  courses:()=>head('المقررات الدراسية')+(S.courses.length?S.courses.map(c=>navCard(e(c.name_ar||'مقرر'),e(c.name_en||''),'📘',`S.course='${e(c.id)}';go('lectures')`)).join(''):'<div class="empty">لا توجد مقررات في هذا المسار حالياً.</div>'),
  lectures:()=>{
    const ok=S.uCourses.includes(String(S.course));
    return head('المحاضرات')+(ok?'':`<div class="card" style="margin-bottom:18px"><b style="display:block;margin-bottom:10px">🔑 فعّل المادة بكود واحد وافتح كل محاضراتها</b>
    <div class="row"><input id="code" class="fld" style="margin:0" placeholder="كود التفعيل" onkeydown="if(event.key==='Enter')unlockCourse()"><button class="btn" style="width:auto" onclick="unlockCourse()">تفعيل</button></div></div>`)+
    (S.lectures.length?S.lectures.map((l,i)=>{const u=unlocked(l);return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:center"><b>${e(l.title)}</b><span class="tag" style="color:var(${u?'--ok':'--warn'})">${u?'مُفعَّلة ✓':'فعّل المادة لفتحها'}</span></div>
    ${u?`<button class="btn" style="margin-top:12px" onclick="S.cur=S.lectures[${i}];go('video')">▶ تشغيل المحاضرة</button>`:''}</div>`}).join(''):'<div class="empty">لا توجد محاضرات حالياً</div>');
  },
  video:()=>{
    const l=S.cur,m=(String(l.youtube_url||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/)||[])[1];
    return `<div style="margin:-20px -20px 0" class="vid" oncontextmenu="return false">${m?`<iframe id="yt" src="https://www.youtube-nocookie.com/embed/${m}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1&autoplay=1" allow="autoplay;fullscreen;encrypted-media" allowfullscreen></iframe><div id="wm">${'د. رحمة مرسي\n'+e(S.profile.full_name)+'\n'+e(S.profile.phone)}</div>`:'<div class="center" style="height:100%;color:var(--err);font-weight:700">لا يمكن تشغيل الفيديو حالياً، تأكد من صحة الرابط.</div>'}</div>
    <h2 style="margin:20px 0 8px;font-size:18px">${e(l.title||'المحاضرة')}</h2><div class="row"><span class="tag" style="color:var(--ok)">✓ مُفعَّلة</span><span class="tag" style="color:var(--mut)">🛡 محمية بحقوق الملكية</span></div>
    ${String(l.pdf_url||'').trim()?`<button class="btn red" style="margin-top:28px" onclick="S.pdf=S.cur.pdf_url;draw()">📄 فتح مذكرة المحاضرة</button>`:''}`;
  }
};
function dash(){
  const inFlow=S.screen!=='home',T=['الرئيسية','محاضراتي','الإشعارات','حسابي'],I=['🏠','🎬','🔔','👤'];
  const body=inFlow?flow[S.screen]():[home,myLectures,notifs,profile][S.tab]();
  return `<div class="top">${inFlow?'<button class="back" onclick="back()">→</button>':''}${logo('sm')}<b>رحوم أكاديمي</b></div>
  <div class="pad" style="flex:1">${body}</div>
  <nav class="bot">${T.map((t,i)=>`<button class="${!inFlow&&S.tab===i?'on':''}" onclick="S.tab=${i};S.screen='home';draw()"><span>${I[i]}</span>${t}</button>`).join('')}</nav>
  ${S.edit?`<div class="modal" onclick="if(event.target===this){S.edit=false;draw()}"><div class="sheet"><h3 style="margin-top:0">تعديل الحساب</h3>
  <input id="en" class="fld" placeholder="الاسم" value="${e(S.profile.full_name)}">
  <select id="ey" class="fld">${[1,2,3].map(n=>`<option value="${n}" ${S.profile.year===n?'selected':''}>${Y(n)}</option>`).join('')}</select>
  <select id="ed" class="fld">${['عام','أساسي'].map(d=>`<option ${S.profile.division===d?'selected':''}>${d}</option>`).join('')}</select>
  <input id="ep" class="fld" type="password" placeholder="كلمة مرور جديدة (اختياري)">
  <button class="btn" onclick="saveProfile()">حفظ التغييرات</button></div></div>`:''}
  ${S.pdf?`<div class="pdf"><div class="top"><button class="back" onclick="S.pdf=null;draw()">→</button><b>مذكرة المحاضرة</b></div><iframe src="${e(S.pdf)}"></iframe></div>`:''}`;
}

/* ───── render ───── */
function draw(){
  clearInterval(wmT);
  const a=$('#app');
  if(S.loading)a.innerHTML=`<div class="center"><div class="pulse">${logo()}</div></div>`;
  else if(!S.user)a.innerHTML=login();
  else if(!S.profile)a.innerHTML=`<div class="center"><div style="font-size:56px">⚠️</div><h3>حدث خطأ في تحميل بيانات الحساب</h3><button class="btn red" onclick="sb.auth.signOut()">تسجيل الخروج والمحاولة مجدداً</button></div>`;
  else if(S.profile.is_active===false)a.innerHTML=pending();
  else{a.innerHTML=dash();if(S.screen==='video'&&$('#wm'))startWM()}
}
function startWM(){
  const P=[[15,15],[85,15],[85,85],[15,85],[50,50],[50,15],[50,85],[15,50],[85,50]];let i=0;
  const mv=()=>{const w=$('#wm');if(!w)return;w.style.left=P[i][0]+'%';w.style.top=P[i][1]+'%';i=(i+1)%P.length};
  mv();wmT=setInterval(mv,5000);
}
document.addEventListener('visibilitychange',()=>{const f=$('#yt');if(document.hidden&&f)f.contentWindow.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'*')});
document.addEventListener('contextmenu',ev=>{if(S.screen==='video')ev.preventDefault()});
draw();
</script>
</body>
</html>
